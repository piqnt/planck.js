<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Planck.js Testbed</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background-color: #111; color: #eee; font-family: sans-serif; }
      #space { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
      #space canvas { width: 100%; height: 100%; display: block; background: #111; }
      #stdout { position: absolute; left: 1em; bottom: 1em; pointer-events: none; opacity: 0.9; color: white; font-family: monospace; }
      #stdout div { white-space: pre-wrap; }
      a { cursor: pointer; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="runtime-shell"></div>
    <div id="space"></div>
    <div id="stdout">
      <div id="testbed-console"></div>
      <div id="testbed-info"></div>
      <div id="testbed-status"></div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
